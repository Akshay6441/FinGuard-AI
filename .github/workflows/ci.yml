name: FinGuard AI CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint, Test & Validate Benchmarks
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System Dependencies for OpenCV and OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 tesseract-ocr

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check .

      - name: Run Test Suite (Pytest)
        run: |
          pytest -v --tb=short tests/

      - name: Run Model Drift Monitor
        run: |
          python -m src.features.drift

  docker-build:
    name: Validate Docker Containers
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build API Docker Image
        run: |
          docker build -t finguard-api:latest -f docker/Dockerfile.api .

      - name: Build UI Docker Image
        run: |
          docker build -t finguard-ui:latest -f docker/Dockerfile.ui .
